<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aptis Listening Part 2 — V4</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Aptis <span>Listening</span></div>
  <div id="counter">Question 1 of 12</div>
  <button id="bookmarkBtn" class="bookmark">🔖 Bookmark</button>
</header>

<main class="page">
<section class="card">
  <div class="heading">
    <div>
      <div class="eyebrow">LISTENING PART 2</div>
      <h1 id="title"></h1>
      <p>Four people are talking about <b id="title2"></b>. Complete the sentences below.</p>
    </div>
    <div class="score" id="score">0 / 4</div>
  </div>

  <div class="audio-panel">
    <button id="play" class="play">▶ Play</button>
    <button id="stop" class="stop">■ Stop</button>
    <span id="attempts">Play 10 times maximum</span>
    <audio id="audio" preload="metadata"></audio>
  </div>

  <div id="speakers" class="speakers"></div>

  <div class="actions">
    <button id="reset" class="secondary">Reset answers</button>
    <button id="check" class="primary">Check answers</button>
  </div>
  <div id="result" class="result" hidden></div>
</section>

<section id="training" class="training" hidden>
  <div class="training-head">
    <div>
      <h2>KEY training</h2>
      <p>Click each KEY to open the exact audio text. Yellow text shows what to listen for.</p>
    </div>
  </div>
  <div id="keyCards"></div>
</section>

<nav class="nav">
  <button id="prev">← Previous</button>
  <div id="dots"></div>
  <button id="next">Next →</button>
</nav>
</main>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
